target-version = "py312"
line-length = 79

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "RUF"]

[lint.per-file-ignores]
# unittest requires camelCase method names such as setUp.
"tests/*" = ["N802"]

[lint.pydocstyle]
convention = "pep257"

[format]
quote-style = "single"
docstring-code-format = false
